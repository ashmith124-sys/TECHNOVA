<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful | TechNova</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f5f5f7;
        }

        .success-card {
            max-width: 600px;
            margin: 100px auto;
            background: white;
            border-radius: 20px;
            padding: 50px 35px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .success-title {
            font-weight: 700;
            margin-bottom: 15px;
        }

        .success-text {
            color: #6e6e73;
            margin-bottom: 30px;
        }

        .shop-btn {
            background: #000;
            color: white;
            border-radius: 10px;
            padding: 13px 30px;
            text-decoration: none;
            font-weight: 600;
        }

        .shop-btn:hover {
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="success-card">

        <div class="success-icon">
            ✅
        </div>

        <h1 class="success-title">
            Order Placed Successfully!
        </h1>

        <p class="success-text">
            Thank you for shopping with TechNova.
            Your order has been received successfully.
        </p>

        <a href="/" class="shop-btn">
            Continue Shopping
        </a>

    </div>

</div>

</body>
</html>
